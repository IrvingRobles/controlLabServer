<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <!-- Bootstrap CSS + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .edit-icon {
            cursor: pointer;
            margin-left: 10px;
            color: #0d6efd;
        }

        .form-control:disabled {
            background-color: #fff !important;
            border: none;
            padding-left: 0;
        }

        .form-select:disabled {
            background-color: #fff !important;
            padding-left: 0;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Barra de Perfil (igual que tu menú principal) -->
    <header class="bg-primary text-white p-3 d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
            <i class="bi bi-person-circle fs-3 me-2"></i>
            <span id="perfil-nombre" class="fw-bold">Cargando...</span>
        </div>
        <button class="btn btn-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
    </header>

    <!-- Contenedor del Perfil -->
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Mi Perfil</h3>
                    </div>
                    <div class="card-body">
                        <form id="profileForm">
                            <!-- Empresa (no editable) -->


                            <!-- Fila 1: Nombre + RFC -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Empresa *</label>
                                    <div class="d-flex align-items-center">
                                        <input type="text" name="empresa" class="form-control" disabled>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('empresa')"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre *</label>
                                    <div class="d-flex align-items-center">
                                        <input type="text" name="nombre" class="form-control" disabled>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('nombre')"></i>
                                    </div>
                                </div>
                            </div>

                            <!-- Fila 2: CURP + Departamento -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">RFC *</label>
                                    <div class="d-flex align-items-center">
                                        <input type="text" name="rfc" class="form-control" disabled>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('rfc')"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">CURP *</label>
                                    <div class="d-flex align-items-center">
                                        <input type="text" name="curp" class="form-control" disabled>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('curp')"></i>
                                    </div>
                                </div>
                            </div>

                            <!-- Fila 3: Puesto + Contrato -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Departamento *</label>
                                    <div class="d-flex align-items-center">
                                        <select name="departamento" class="form-select" disabled>
                                            <option value="SERVICIO">Servicio</option>
                                            <option value="ALMACEN">Almacén</option>
                                            <option value="COMPRAS">Compras</option>
                                            <option value="PAGOS">Pagos</option>
                                            <option value="COBRANZAS">Cobranzas</option>
                                            <option value="RECURSOS HUMANOS">Recursos Humanos</option>
                                        </select>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('departamento')"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Puesto *</label>
                                    <div class="d-flex align-items-center">
                                        <input type="text" name="puesto" class="form-control" disabled>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('puesto')"></i>
                                    </div>
                                </div>

                            </div>

                            <!-- Fila 4: Jornada + NSS -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Contrato *</label>
                                    <div class="d-flex align-items-center">
                                        <select name="contrato" class="form-select" disabled>
                                            <option value="PERMANENTE">PERMANENTE</option>
                                            <option value="TEMPORAL">TEMPORAL</option>
                                        </select>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('contrato')"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Jornada *</label>
                                    <div class="d-flex align-items-center">
                                        <select name="jornada" class="form-select" disabled>
                                            <option value="MENSUAL">MENSUAL</option>
                                            <option value="QUINCENAL">QUINCENAL</option>
                                            <option value="SEMANAL">SEMANAL</option>
                                            <option value="DIARIO">DIARIO</option>
                                        </select>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('jornada')"></i>
                                    </div>
                                </div>

                            </div>

                            <!-- Fila 5: Domicilio + Teléfono -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">NSS *</label>
                                    <div class="d-flex align-items-center">
                                        <input type="text" name="nss" class="form-control" disabled>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('nss')"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Domicilio *</label>
                                    <div class="d-flex align-items-center">
                                        <input type="text" name="domicilio" class="form-control" disabled>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('domicilio')"></i>
                                    </div>
                                </div>

                            </div>

                            <!-- Fila 6: Fecha de Ingreso + Correo -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Teléfono</label>
                                    <div class="d-flex align-items-center">
                                        <input type="text" name="telefono" class="form-control" disabled>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('telefono')"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha de Ingreso *</label>
                                    <div class="d-flex align-items-center">
                                        <input type="date" name="ingreso" class="form-control" disabled>
                                        <i class="bi bi-pencil-square edit-icon" onclick="toggleEdit('ingreso')"></i>
                                    </div>
                                </div>

                            </div>

                            <!-- Botones (como en tus ejemplos) -->
                            <div class="d-flex justify-content-end mt-4">
                                <button type="button" class="btn btn-outline-secondary me-2"
                                     onclick="history.back()">Cerrar</button>
                                <button type="button" id="saveBtn" class="btn btn-primary" disabled
                                    onclick="guardarCambios()">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Nuestro JS -->

    <script src="scripts/miPerfil.js"></script>
    <!-- Script para manejar sesión y perfil -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const perfilNombre = document.getElementById('perfil-nombre');
            const usuario = JSON.parse(localStorage.getItem('user'));

            if (usuario) {
                perfilNombre.textContent = usuario.username || 'Usuario';
            } else {
                perfilNombre.textContent = 'Invitado';
                setTimeout(() => {
                    window.location.href = "login.html"; // Redirigir al login si no hay usuario
                }, 2000);
            }
        });

        function cerrarSesion() {
            localStorage.removeItem('user'); // Borrar datos del usuario
            window.location.href = "login.html"; // Redirigir al login
        }
    </script>

</body>

</html>
