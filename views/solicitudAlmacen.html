<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Materiales</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .card-header {
            border-radius: 10px 10px 0 0 !important;
        }

        .readonly-field {
            background-color: #f8f9fa;
        }

        .required-field::after {
            content: " *";
            color: #dc3545;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('user');

            if (!user) {
                window.location.href = "login.html";
            }
        });
    </script>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body class="bg-light">
    <!-- Agrega Bootstrap Icons en el <head> si aún no lo tienes -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index1.html">
                <i class="bi bi-house-door"></i> Menú Principal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="vistaAlmacen.html">
                            <i class="bi bi-file-earmark-plus"></i> Vista del Almacen
                        </a>
                    </li>
                </ul>
                <!-- Nombre del usuario y botón de cerrar sesión -->
                <div class="d-flex align-items-center">
                    <i class="bi bi-person-circle text-light me-2"></i>
                    <span id="perfil-nombre" class="text-light me-3">Cargando...</span>
                    <button onclick="cerrarSesion()" class="btn btn-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-cart-plus"></i> Nueva Solicitud</h4>
            </div>
            <div class="card-body">
                <form id="formSolicitud">
                    <!-- Fecha (Mismo ID que en tu JS) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold required-field">Fecha:</label>
                        <input type="date" class="form-control" id="fecha" required>
                    </div>

                    <!-- Usuario (Mismo ID que en tu JS) -->
                    <!-- Usuario (agrega un campo oculto para el ID) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Solicitante:</label>
                        <input type="text" class="form-control readonly-field" id="usernameDisplay" readonly>
                        <input type="hidden" id="idUsuario"> <!-- Campo oculto para el ID -->
                    </div>

                    <!-- Orden de Trabajo (Mismo ID que en tu JS) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold required-field">Orden de Trabajo:</label>
                        <select class="form-select" id="idOt" required>
                            <option value="" selected disabled>Seleccione OT</option>
                            <!-- Opciones se cargarán con JavaScript -->
                        </select>
                    </div>

                    <!-- Productos (Mismo ID que en tu JS) -->
                    <!-- Productos -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Productos:</label>
                        <div class="input-group mb-2">
                            <select class="form-select" id="idProductos">
                                <option value="" selected disabled>Seleccione un producto</option>
                            </select>
                            <input type="number" class="form-control" id="unidades" min="1" value="1">
                            <button class="btn btn-primary" type="button" id="btnAgregarProducto">
                                <i class="bi bi-plus"></i> Agregar
                            </button>
                        </div>
                        <!-- Lista de productos agregados -->
                        <div id="listaProductos" class="mb-3"></div>
                    </div>

                    <!-- Nota (Mismo ID que en tu JS) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Detalles de la solicitud:</label>
                        <textarea class="form-control" id="nota" rows="3"
                            placeholder="Especifique detalles adicionales..."></textarea>
                        <div class="form-text">Debe seleccionar un producto o escribir una nota</div>
                    </div>

                    <!-- Botones -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <button type="button" class="btn btn-secondary me-md-2"
                            onclick="window.location.href='/index1.html'">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send-check"></i> Enviar Solicitud
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal genérico (Mismo ID que en tu JS) -->
    <div class="modal fade" id="customModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn" id="modalButton" data-bs-dismiss="modal"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu JavaScript (Manteniendo todos los IDs iguales) -->
    <script src="/scripts/solicitudAlmacen.js"></script>
    <script>
        function cerrarSesion() {
            localStorage.removeItem('user'); // Borrar datos del usuario
            window.location.href = "login.html"; // Redirigir al login
        }

        document.addEventListener('DOMContentLoaded', () => {
            const perfilNombre = document.getElementById('perfil-nombre');

            if (perfilNombre) { // Verifica que el elemento exista antes de modificarlo
                const usuario = JSON.parse(localStorage.getItem('user'));
                perfilNombre.textContent = usuario ? usuario.username || 'Usuario' : 'Invitado';

                if (!usuario) {
                    setTimeout(() => {
                        window.location.href = "login.html"; // Redirigir al login si no hay usuario
                    }, 2000);
                }
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = JSON.parse(localStorage.getItem('user'));

            if (!usuario) {
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            }
        });
    </script>
</body>

</html>
