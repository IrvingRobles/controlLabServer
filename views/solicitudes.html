<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Solicitudes de Almacén</h1>
        
        <!-- Filtros -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="filtroFecha" class="form-label">Filtrar por fecha:</label>
                        <input type="date" class="form-control" id="filtroFecha">
                    </div>
                    <div class="col-md-4">
                        <label for="filtroIdOt" class="form-label">Filtrar por OT:</label>
                        <input type="text" class="form-control" id="filtroIdOt" placeholder="ID OT">
                    </div>
                    <div class="col-md-4">
                        <label for="filtroIdUsuario" class="form-label">Filtrar por Usuario:</label>
                        <input type="text" class="form-control" id="filtroIdUsuario" placeholder="ID Usuario">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <button id="btnFiltrar" class="btn btn-primary me-2">
                            <i class="bi bi-funnel"></i> Filtrar
                        </button>
                        <button id="btnLimpiar" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                        </button>
                    </div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="hideCompleted">
                    <label class="form-check-label" for="hideCompleted">Ocultar completados</label>
                </div>
            </div>
        </div>
        
        <!-- Contenedor de tarjetas -->
        <div id="contenedorSolicitudes" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- Las tarjetas se generarán dinámicamente aquí -->
        </div>
    </div>

    <!-- Modal genérico -->
    <div class="modal fade" id="customModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn" id="modalButton" data-bs-dismiss="modal"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/scripts/adminBuscarSolicitudes.js"></script>
</body>
</html>
