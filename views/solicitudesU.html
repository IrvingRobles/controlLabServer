<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('user');

            if (!user) {
                window.location.href = "login.html";
            }
        });
    </script>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <!-- Agrega Bootstrap Icons en el <head> si aún no lo tienes -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index1.html">
                <i class="bi bi-house-door"></i> Menú Principal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="adminVistaAlmacen.html">
                            <i class="bi bi-file-earmark-plus"></i> Almacen
                        </a>
                    </li>
                </ul>
                <!-- Nombre del usuario y botón de cerrar sesión -->
                <div class="d-flex align-items-center">
                    <i class="bi bi-person-circle text-light me-2"></i>
                    <span id="perfil-nombre" class="text-light me-3">Cargando...</span>
                    <button onclick="cerrarSesion()" class="btn btn-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="mb-4">Solicitudes de Almacén</h1>

        <!-- Filtros -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="filtroFecha" class="form-label">Filtrar por fecha:</label>
                        <input type="date" class="form-control" id="filtroFecha">
                    </div>
                    <div class="col-md-4">
                        <label for="filtroIdOt" class="form-label">Filtrar por OT:</label>
                        <input type="text" class="form-control" id="filtroIdOt" placeholder="ID OT">
                    </div>
                    <div class="col-md-4">
                        <label for="filtroIdUsuario" class="form-label">Filtrar por Usuario:</label>
                        <input type="text" class="form-control" id="filtroIdUsuario" placeholder="ID Usuario">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <button id="btnFiltrar" class="btn btn-primary me-2">
                            <i class="bi bi-funnel"></i> Filtrar
                        </button>
                        <button id="btnLimpiar" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                        </button>
                    </div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="hideCompleted" checked>
                    <label class="form-check-label" for="hideCompleted">Ocultar completados</label>
                </div>
            </div>
        </div>

        <!-- Contenedor de tarjetas -->
        <div id="contenedorSolicitudes" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- Las tarjetas se generarán dinámicamente aquí -->
        </div>
    </div>

    <!-- Modal genérico -->
    <div class="modal fade" id="customModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn" id="modalButton" data-bs-dismiss="modal"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/scripts/solicitudesU.js"></script>
    <script>
        function cerrarSesion() {
            localStorage.removeItem('user'); // Borrar datos del usuario
            window.location.href = "login.html"; // Redirigir al login
        }

        document.addEventListener('DOMContentLoaded', () => {
            const perfilNombre = document.getElementById('perfil-nombre');

            if (perfilNombre) { // Verifica que el elemento exista antes de modificarlo
                const usuario = JSON.parse(localStorage.getItem('user'));
                perfilNombre.textContent = usuario ? usuario.username || 'Usuario' : 'Invitado';

                if (!usuario) {
                    setTimeout(() => {
                        window.location.href = "login.html"; // Redirigir al login si no hay usuario
                    }, 2000);
                }
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = JSON.parse(localStorage.getItem('user'));

            if (!usuario) {
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            }
        });
    </script>
</body>

</html>
